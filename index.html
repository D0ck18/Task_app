// ── Drag to reorder ───────────────────────────────────────────────────────────
let _canDrag = false;
function setupDragDrop() {
  const list = document.getElementById('taskList');
  list.addEventListener('mousedown', e => { _canDrag = !!e.target.closest('.drag-handle'); });
  list.addEventListener('dragstart', e => {
    if (!_canDrag) { e.preventDefault(); return; }
    const item = e.target.closest('.task-item:not(.subtask)');
    if (!item) return;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', item.dataset.id);
    item.classList.add('dragging');
  });
  list.addEventListener('dragend', e => {
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    _canDrag = false;
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.task-item:not(.subtask):not(.dragging)');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (item) item.classList.add('drag-over');
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('.task-item:not(.subtask)');
    if (!target) return;
    target.classList.remove('drag-over');
    const fromId = e.dataTransfer.getData('text/plain');
    const toId   = target.dataset.id;
    if (!fromId || fromId === toId) return;
    const tasks   = [...state.tasks];
    const fromIdx = tasks.findIndex(t => t.id === fromId);
    const toIdx   = tasks.findIndex(t => t.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = tasks.splice(fromIdx, 1);
    tasks.splice(tasks.findIndex(t => t.id === toId), 0, moved);
    state.tasks = tasks;
    render(); scheduleSave();
  });
}

  const estimate   = withDetails ? (document.getElementById('qaddEstimate').value || null) : null;
  closeQadd();
  await run(async () => {
    const task = newTask(title);
    // Use explicitly chosen folder, fall back to current folder context
    if (folder) {
      task.folder = folder;
    } else if (!task.parent_id && state.folder !== '__all__' && state.folder !== '__none__' && state.folder !== '__flagged__') {
      task.folder = state.folder;
    }
    task.notes      = notes;
    task.start_date = startDate;
    task.due_date   = due;
    task.due_time   = dueTime;
    task.tags       = tags;
    task.context    = context;
    task.estimate   = estimate;
    if (repeatType) {
      task.recurrence = { type: repeatType, time: document.getElementById('qaddRepeatTime').value || null };
      if (repeatType === 'weekly')  task.recurrence.day = parseInt(document.getElementById('qaddRepeatDay').value ?? '0');
      if (repeatType === 'monthly') task.recurrence.day = parseInt(document.getElementById('qaddRepeatMonthDay').value || '1');
    }
    // Apply D-/W- prefix if not already present
    if (tag === 'd' && !/^[Dd]-/.test(task.title)) task.title = 'D-' + task.title;
    if (tag === 'w' && !/^[Ww]-/.test(task.title)) task.title = 'W-' + task.title;
    const tasks = [task, ...state.tasks];
    await ghSave(tasks);
    state.tasks = tasks;
    toast('Task added');
    if (cfg.autoExpand) state.expanded = task.id;
  });
}

// ── Task list delegation ─────────────────────────────────────────────────────
document.getElementById('taskList').addEventListener('click', async e => {
  // Column header sort
  const sortEl = e.target.closest('[data-sort-col]');
  if (sortEl) {
    const col = sortEl.dataset.sortCol;
    state.sorts[0] = (state.sorts[0] === col) ? 'priority' : col;
    document.getElementById('sortPrimary').value = state.sorts[0];
    render(); return;
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;

  if (act === 'bulk-toggle') {
    e.stopPropagation();
    if (state.selected.has(id)) state.selected.delete(id);
    else state.selected.add(id);
    updateBulkBar();
    const cb = e.target.closest('.bulk-checkbox');
    if (cb) cb.checked = state.selected.has(id);
    return;
  }

  if (act === 'expand') {
    state.expanded = state.expanded === id ? null : id;
    render(); return;
  }
  if (act === 'collapse') { state.expanded = null; render(); return; }

  if (act === 'toggle') {
    e.stopPropagation();
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    const nextStatus = (t.status === 'done') ? 'open' : 'done';
    const i = state.tasks.findIndex(x => x.id === id);
    const completedAt = nextStatus === 'done' ? new Date().toISOString() : null;
    state.tasks[i] = { ...state.tasks[i], status: nextStatus, updated_at: new Date().toISOString(), completed_at: completedAt };
    if (nextStatus === 'done') {
      const before = state.tasks.length;
      state.tasks = spawnNextOccurrence(t, state.tasks);
      if (state.tasks.length > before) toast('Done — next occurrence added to Open');
    }
    render();
    scheduleSave();
    return;
  }

  if (act === 'setstatus') {
    e.stopPropagation(); e.preventDefault();
    const newStatus = el.dataset.status;
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    if (t.status === newStatus) return;
    const i = state.tasks.findIndex(x => x.id === id);
    const completedAt2 = newStatus === 'done' ? new Date().toISOString() : null;
    state.tasks[i] = { ...state.tasks[i], status: newStatus, updated_at: new Date().toISOString(), completed_at: completedAt2 };
    if (newStatus === 'done') {
      const before = state.tasks.length;
      state.tasks = spawnNextOccurrence(t, state.tasks);
      if (state.tasks.length > before) toast('Done — next occurrence added to Open');
    }
    render();
    scheduleSave();
    return;
  }

  if (act === 'flag') {
    e.stopPropagation();
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    await run(() => patchTask(id, { flagged: !t.flagged })); return;
  }

  if (act === 'save') {
    const title    = document.getElementById(`et-${id}`)?.value.trim();
    if (!title) { toast('Title required'); return; }
    const notes    = document.getElementById(`en-${id}`)?.value.trim() || '';
    const start_date = document.getElementById(`es-${id}`)?.value || null;
    const due_date   = document.getElementById(`ed-${id}`)?.value || null;
    const due_time   = document.getElementById(`etm-${id}`)?.value || null;
    const folder     = document.getElementById(`ef-${id}`)?.value.trim() || null;
    const priority    = parseInt(document.getElementById(`ep-${id}`)?.value || '0');
    const flagged     = document.getElementById(`efl-${id}`)?.checked || false;
    const sharedRaw   = document.getElementById(`esw-${id}`)?.value || '';
    const shared_with = sharedRaw.split(',').map(s => s.trim()).filter(Boolean);
    const tagsRaw     = document.getElementById(`etags-${id}`)?.value || '';
    const tags        = tagsRaw.split(',').map(s => s.trim()).filter(Boolean);
    const context     = document.getElementById(`ectx-${id}`)?.value.trim() || null;
    const estimate    = document.getElementById(`eest-${id}`)?.value || null;
    const recurType   = document.getElementById(`ert-${id}`)?.value || '';
    let recurrence = null;
    if (recurType) {
      recurrence = { type: recurType, time: document.getElementById(`ertime-${id}`)?.value || null };
      if (recurType === 'weekly')  recurrence.day = parseInt(document.getElementById(`erd-${id}`)?.value ?? '0');
      if (recurType === 'monthly') recurrence.day = parseInt(document.getElementById(`erm-${id}`)?.value || '1');
    }
    await run(async () => {
      await patchTask(id, { title, notes, start_date, due_date, due_time, folder, priority, flagged, shared_with, recurrence, tags, context, estimate });
      state.expanded = null; toast('Saved');
    }); return;
  }

  if (act === 'showsub') {
    const row = document.getElementById(`subrow-${id}`);
    if (row) { row.style.display = row.style.display === 'none' ? 'flex' : 'none'; }
    document.getElementById(`subinput-${id}`)?.focus();
    return;
  }

  if (act === 'addsub') {
    const input = document.getElementById(`subinput-${id}`);
    const title = input?.value.trim();
    if (!title) return;
    input.value = '';
    await run(async () => { await addTask(title, id); toast('Subtask added'); }); return;
  }

  if (act === 'delete') {
    e.stopPropagation();
    const removed = state.tasks.filter(t => t.id === id || t.parent_id === id);
    if (!removed.length) return;
    state.tasks = state.tasks.filter(t => t.id !== id && t.parent_id !== id);
    if (state.expanded === id) state.expanded = null;
    render();
    scheduleUndoDelete(removed, id);
    return;
  }

  // ── Calendar actions ───────────────────────────────────────────────────────
  if (act === 'cal-panel-close') {
    state.calDay = null; renderCalendar(); return;
  }

  if (act === 'cal-day') {
    const date = el.dataset.date;
    if (!date) return;
    // If clicking the panel's "Add task" button, open quick-add directly
    if (e.target.closest('.cal-panel-add')) {
      if (!ready()) { toast('Set up GitHub in Settings'); openSettings(); return; }
      openQadd('', date); return;
    }
    // In week view, clicking a day header switches to month and selects that day
    if (state.calMode === 'week') {
      const d = parseDateStr(date);
      state.calMode = 'month'; state.calMonth = d.getMonth(); state.calYear = d.getFullYear();
      state.calDay = date; renderCalendar(); return;
    }
    // In month view, select the day to show the panel
    state.calDay = state.calDay === date ? null : date;
    renderCalendar(); return;
  }

  if (act === 'cal-task') {
    if (state.view === 'calendar') {
      // Show popover in calendar instead of jumping away
      const t = state.tasks.find(x => x.id === id); if (!t) return;
      showCalPopover(t, e.clientX, e.clientY); return;
    }
    // In list views, expand inline as before
    state.expanded = id;
    render();
    setTimeout(() => {
      const el = document.querySelector(`[data-id="${id}"] .task-expand`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
    return;
  }

  if (act === 'cal-popover-edit') {
    closeCalPopover();
    state.view = 'open';
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.view === 'open'));
    state.expanded = id;
    render();
    setTimeout(() => {
      const el = document.querySelector(`[data-id="${id}"] .task-expand`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
    return;
  }

  if (act === 'cal-popover-done') {
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    const nextStatus = t.status === 'done' ? 'open' : 'done';
    closeCalPopover();
    await run(async () => {
      await patchTask(id, { status: nextStatus });
      if (nextStatus === 'done') {
        const before = state.tasks.length;
        state.tasks = spawnNextOccurrence(t, state.tasks);
        if (state.tasks.length > before) toast('Done — next occurrence added');
      }
    });
    return;
  }

  if (act === 'cal-popover-close') { closeCalPopover(); return; }

  if (act === 'ics-download') {
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    downloadIcs(t); return;
  }
});

// ── Calendar export helpers ──────────────────────────────────────────────────
function taskToGCalUrl(t) {
  // Dates in Google Calendar format: YYYYMMDDTHHmmssZ or YYYYMMDD
  function toGCalDate(dateStr, timeStr) {
    if (!dateStr) return null;
    if (timeStr) {
      // Local datetime → format as YYYYMMDDTHHmmss (no Z, so it respects local tz)
      const [y, m, d] = dateStr.split('-');
      const [hh, mm] = timeStr.split(':');
      return `${y}${m}${d}T${hh}${mm}00`;
    }
    return dateStr.replace(/-/g, ''); // all-day: YYYYMMDD
  }
  const start = toGCalDate(t.due_date, t.due_time);
  if (!start) return null;
  // End: 1 hour after start for timed, next day for all-day
  let end;
  if (t.due_time) {
    const [hh, mm] = t.due_time.split(':').map(Number);
    const endH = String(hh + 1).padStart(2, '0');
    end = start.slice(0, 9) + endH + start.slice(11);
  } else {
    const d = new Date(t.due_date + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    end = d.toISOString().slice(0,10).replace(/-/g,'');
  }
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: t.title,
    dates: `${start}/${end}`,
    details: t.notes || '',
    location: t.context || '',
  });
  return `https://calendar.google.com/calendar/render?${params}`;
}

function taskToIcs(t) {
  function toIcsDate(dateStr, timeStr) {
    if (!dateStr) return null;
    if (timeStr) {
      const [y, m, d] = dateStr.split('-');
      const [hh, mm] = timeStr.split(':');
      return `${y}${m}${d}T${hh}${mm}00`;
    }
    return dateStr.replace(/-/g, '');
  }
  const start = toIcsDate(t.due_date, t.due_time);
  if (!start) return null;
  let end;
  if (t.due_time) {
    const [hh, mm] = t.due_time.split(':').map(Number);
    const endH = String(hh + 1).padStart(2, '0');
    end = start.slice(0, 9) + endH + start.slice(11);
  } else {
    const d = new Date(t.due_date + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    end = d.toISOString().slice(0,10).replace(/-/g,'');
  }
  const dtStamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const allDay  = !t.due_time;
  const dtProp  = allDay ? 'DATE' : 'DATE-TIME';
  // Build RRULE if task has recurrence
  let rrule = '';
  if (t.recurrence && t.recurrence.type) {
    const DAYS_ICS = ['SU','MO','TU','WE','TH','FR','SA'];
    if (t.recurrence.type === 'daily') {
      rrule = 'RRULE:FREQ=DAILY';
    } else if (t.recurrence.type === 'weekly') {
      const day = DAYS_ICS[t.recurrence.day ?? 0];
      rrule = `RRULE:FREQ=WEEKLY;BYDAY=${day}`;
    } else if (t.recurrence.type === 'monthly') {
      rrule = `RRULE:FREQ=MONTHLY;BYMONTHDAY=${t.recurrence.day ?? 1}`;
    }
  }

  const lines   = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//TaskManager//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:${t.id}@taskmanager`,
    `DTSTAMP:${dtStamp}`,
    `DTSTART;VALUE=${dtProp}:${start}`,
    `DTEND;VALUE=${dtProp}:${end}`,
    `SUMMARY:${t.title.replace(/,/g, '\\,')}`,
    t.notes   ? `DESCRIPTION:${t.notes.replace(/\n/g,'\\n').replace(/,/g,'\\,')}` : '',
    t.context ? `LOCATION:${t.context}` : '',
    rrule,
    'END:VEVENT',
    'END:VCALENDAR',
  ].filter(Boolean).join('\r\n');
  return lines;
}

function downloadIcs(t) {
  const ics = taskToIcs(t);
  if (!ics) { toast('Task needs a due date to export'); return; }
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `${t.title.slice(0,40).replace(/[^a-z0-9]/gi,'_')}.ics`;
  a.click(); URL.revokeObjectURL(url);
}

function calExportHtml(t) {
  const gcalUrl = taskToGCalUrl(t);
  if (!t.due_date) return '';
  return `<div class="cal-export-row">
    ${gcalUrl ? `<a class="cal-export-btn gcal" href="${gcalUrl}" target="_blank" rel="noopener">📅 Google Calendar</a>` : ''}
    <button class="cal-export-btn ical" data-act="ics-download" data-id="${h(t.id)}">🍎 Apple / iCal (.ics)</button>
  </div>`;
}

// ── Calendar task popover ────────────────────────────────────────────────────
function showCalPopover(t, cx, cy) {
  closeCalPopover();
  const statusCls = t.status === 'done' ? 'status-done' : t.status === 'inprogress' ? 'status-progress' : 'status-open';
  const statusLabel = t.status === 'done' ? 'Done' : t.status === 'inprogress' ? 'In Progress' : 'Open';
  const pop = document.createElement('div');
  pop.className = 'cal-task-popover';
  pop.id = 'calTaskPopover';
  pop.innerHTML = `
    <div class="cal-popover-header">
      <div class="cal-popover-title">${h(t.title)}</div>
      <button class="cal-popover-close" data-act="cal-popover-close">×</button>
    </div>
    <span class="cal-popover-status ${statusCls}">${statusLabel}</span>
    ${t.due_date ? `<div class="cal-popover-meta">Due: <span>${t.due_date}${t.due_time ? ' at ' + fmtTime(t.due_time) : ''}</span></div>` : ''}
    ${t.folder  ? `<div class="cal-popover-meta">Folder: <span>${h(t.folder)}</span></div>` : ''}
    ${t.notes   ? `<div class="cal-popover-notes">${h(t.notes)}</div>` : ''}
    <div class="cal-popover-actions">
      <button class="cal-popover-btn secondary" data-act="cal-popover-done" data-id="${h(t.id)}">${t.status === 'done' ? 'Reopen' : 'Mark Done'}</button>
      <button class="cal-popover-btn primary" data-act="cal-popover-edit" data-id="${h(t.id)}">Edit Task</button>
    </div>
    ${calExportHtml(t)}`;
  document.body.appendChild(pop);

  // Position: prefer right of click, flip left if too close to edge
  const pw = 280, ph = pop.offsetHeight || 220;
  let left = cx + 12;
  let top  = cy - 20;
  if (left + pw > window.innerWidth - 12) left = cx - pw - 12;
  if (top + ph > window.innerHeight - 12) top = window.innerHeight - ph - 12;
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top  = Math.max(8, top)  + 'px';

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', _calPopoverOutside, { capture: true, once: true });
  }, 0);
}
function _calPopoverOutside(e) {
  const pop = document.getElementById('calTaskPopover');
  if (pop && !pop.contains(e.target)) closeCalPopover();
  else if (pop) document.addEventListener('click', _calPopoverOutside, { capture: true, once: true });
}
function closeCalPopover() {
  const pop = document.getElementById('calTaskPopover');
  if (pop) pop.remove();
}

// ── Auto-refresh ─────────────────────────────────────────────────────────────
setInterval(() => { if (ready() && !state.loading) refresh(); }, 30_000);
setInterval(renderSync, 5_000);

// ── Live now-line update (every minute) ──────────────────────────────────────
setInterval(() => {
  const line = document.getElementById('calNowLine');
  if (!line) return;
  const now = new Date();
  line.style.top = ((now.getHours() + now.getMinutes() / 60) * SLOT_H).toFixed(1) + 'px';
}, 60_000);

// ── Init ─────────────────────────────────────────────────────────────────────
loadCfg();
setupDragDrop();
if (ready()) refresh();
else openSettings();
</script>
</body>
</html>
