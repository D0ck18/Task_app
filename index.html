// ── Drag to reorder ───────────────────────────────────────────────────────────
let _canDrag = false;
function setupDragDrop() {
  const list = document.getElementById('taskList');
  list.addEventListener('mousedown', e => { _canDrag = !!e.target.closest('.drag-handle'); });
  list.addEventListener('dragstart', e => {
    if (!_canDrag) { e.preventDefault(); return; }
    const item = e.target.closest('.task-item:not(.subtask)');
    if (!item) return;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', item.dataset.id);
    item.classList.add('dragging');
  });
  list.addEventListener('dragend', e => {
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    _canDrag = false;
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.task-item:not(.subtask):not(.dragging)');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (item) item.classList.add('drag-over');
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('.task-item:not(.subtask)');
    if (!target) return;
    target.classList.remove('drag-over');
    const fromId = e.dataTransfer.getData('text/plain');
    const toId   = target.dataset.id;
    if (!fromId || fromId === toId) return;
    const tasks   = [...state.tasks];
    const fromIdx = tasks.findIndex(t => t.id === fromId);
    const toIdx   = tasks.findIndex(t => t.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = tasks.splice(fromIdx, 1);
    tasks.splice(tasks.findIndex(t => t.id === toId), 0, moved);
    state.tasks = tasks;
    render(); scheduleSave();
  });
}

async function submitQadd(withDetails) {
  const title = _qaddTitle || document.getElementById('qaddTitleInput').value.trim();
  if (!title) { document.getElementById('qaddTitleInput').focus(); toast('Title required'); return; }
  const notes      = withDetails ? (document.getElementById('qaddNotes').value.trim() || '') : '';
  const startDate  = withDetails ? (document.getElementById('qaddStart').value || null) : null;
  const due        = withDetails ? (document.getElementById('qaddDue').value || null) : null;
  const dueTime    = withDetails ? (document.getElementById('qaddTime').value || null) : null;
  const repeatType = withDetails ? (document.getElementById('qaddRepeat').value || '') : '';
  const tag        = withDetails ? _qaddTag : '';
  const folder     = withDetails ? (document.getElementById('qaddFolder').value || null) : null;
  const tags       = withDetails ? (document.getElementById('qaddTags').value.split(',').map(s=>s.trim()).filter(Boolean)) : [];
  const context    = withDetails ? (document.getElementById('qaddContext').value.trim() || null) : null;
  const estimate   = withDetails ? (document.getElementById('qaddEstimate').value || null) : null;
  closeQadd();
  await run(async () => {
    const task = newTask(title);
    // Use explicitly chosen folder, fall back to current folder context
    if (folder) {
      task.folder = folder;
    } else if (!task.parent_id && state.folder !== '__all__' && state.folder !== '__none__' && state.folder !== '__flagged__') {
      task.folder = state.folder;
    }
    task.notes      = notes;
    task.start_date = startDate;
    task.due_date   = due;
    task.due_time   = dueTime;
    task.tags       = tags;
    task.context    = context;
    task.estimate   = estimate;
    if (repeatType) task.recurrence = { type: repeatType, time: null };
    // Apply D-/W- prefix if not already present
    if (tag === 'd' && !/^[Dd]-/.test(task.title)) task.title = 'D-' + task.title;
    if (tag === 'w' && !/^[Ww]-/.test(task.title)) task.title = 'W-' + task.title;
    const tasks = [task, ...state.tasks];
    await ghSave(tasks);
    state.tasks = tasks;
    toast('Task added');
    if (cfg.autoExpand) state.expanded = task.id;
  });
}

document.getElementById('qaddTagNone').addEventListener('click', () => setQaddTag(''));
document.getElementById('qaddTagD').addEventListener('click', () => setQaddTag(_qaddTag === 'd' ? '' : 'd'));
document.getElementById('qaddTagW').addEventListener('click', () => setQaddTag(_qaddTag === 'w' ? '' : 'w'));
document.getElementById('qaddConfirm').addEventListener('click', () => submitQadd(true));
document.getElementById('qaddSkip').addEventListener('click', () => submitQadd(false));
document.getElementById('qaddClose').addEventListener('click', closeQadd);
document.getElementById('qaddOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('qaddOverlay')) closeQadd();
});
document.getElementById('qaddNotes').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQadd(true); }
  if (e.key === 'Escape') closeQadd();
});
document.getElementById('qaddDue').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitQadd(true);
  if (e.key === 'Escape') closeQadd();
});

// ── Capture ──────────────────────────────────────────────────────────────────
function capture() {
  const inp = document.getElementById('captureInput');
  const title = inp.value.trim();
  if (!title) { inp.focus(); return; }
  if (!ready()) { toast('Set up GitHub in Settings'); openSettings(); return; }
  inp.value = ''; inp.focus();
  openQadd(title);
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }

document.getElementById('sidebarToggle').addEventListener('click', () =>
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar());
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

document.getElementById('sidebarList').addEventListener('click', e => {
  const btn = e.target.closest('.sidebar-item');
  if (!btn) return;
  state.folder = btn.dataset.folder;
  render();
  if (window.innerWidth < 600) closeSidebar();
});

// ── New folder ───────────────────────────────────────────────────────────────
document.getElementById('newFolderBtn').addEventListener('click', () => {
  document.getElementById('newFolderRow').classList.add('open');
  document.getElementById('newFolderInput').focus();
});
function confirmNewFolder() {
  const input = document.getElementById('newFolderInput');
  const name = input.value.trim();
  if (!name) { document.getElementById('newFolderRow').classList.remove('open'); return; }
  if (!state.extraFolders.includes(name) && !folders().includes(name)) state.extraFolders.push(name);
  state.folder = name; cfg.defaultFolder = name; saveCfg();
  input.value = ''; document.getElementById('newFolderRow').classList.remove('open');
  render(); toast(`Folder "${name}" created`);
  if (window.innerWidth < 600) closeSidebar();
}
document.getElementById('newFolderConfirm').addEventListener('click', confirmNewFolder);
document.getElementById('newFolderInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmNewFolder();
  if (e.key === 'Escape') document.getElementById('newFolderRow').classList.remove('open');
});

// ── Settings ─────────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('cfgOwner').value    = cfg.owner || '';
  document.getElementById('cfgRepo').value     = cfg.repo  || '';
  document.getElementById('cfgToken').value    = cfg.token || '';
  document.getElementById('cfgUsername').value = cfg.username || '';
  document.getElementById('cfgFolder').value   = cfg.defaultFolder || '';
  document.getElementById('cfgAutoExpand').checked = !!cfg.autoExpand;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

document.getElementById('addBtn').addEventListener('click', capture);
document.getElementById('captureInput').addEventListener('keydown', e => { if (e.key === 'Enter') capture(); });
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('modalClose').addEventListener('click', closeSettings);
document.getElementById('cancelBtn').addEventListener('click', closeSettings);
document.getElementById('settingsModal').addEventListener('click', e => {
  if (e.target === document.getElementById('settingsModal')) closeSettings();
});
document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
  const owner = document.getElementById('cfgOwner').value.trim();
  const repo  = document.getElementById('cfgRepo').value.trim();
  const token = document.getElementById('cfgToken').value.trim();
  if (!owner || !repo || !token) { toast('Owner, repo, and token are required'); return; }
  cfg = { owner, repo, token,
    username: document.getElementById('cfgUsername').value.trim() || null,
    defaultFolder: document.getElementById('cfgFolder').value.trim() || null,
    autoExpand: document.getElementById('cfgAutoExpand').checked };
  saveCfg(); closeSettings(); await refresh();
});

// ── View toggle ──────────────────────────────────────────────────────────────
document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if (!btn) return;
  state.view = btn.dataset.view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// ── Sort toggles ─────────────────────────────────────────────────────────────
['sortPrimary', 'sortSecondary', 'sortTertiary'].forEach((elId, i) => {
  document.getElementById(elId).addEventListener('change', e => {
    state.sorts[i] = e.target.value;
    render();
  });
});

// ── Task list delegation ─────────────────────────────────────────────────────
document.getElementById('taskList').addEventListener('click', async e => {
  // Column header sort
  const sortEl = e.target.closest('[data-sort-col]');
  if (sortEl) {
    const col = sortEl.dataset.sortCol;
    state.sorts[0] = (state.sorts[0] === col) ? 'priority' : col;
    document.getElementById('sortPrimary').value = state.sorts[0];
    render(); return;
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;

  if (act === 'bulk-toggle') {
    e.stopPropagation();
    if (state.selected.has(id)) state.selected.delete(id);
    else state.selected.add(id);
    updateBulkBar();
    const cb = e.target.closest('.bulk-checkbox');
    if (cb) cb.checked = state.selected.has(id);
    return;
  }

  if (act === 'expand') {
    state.expanded = state.expanded === id ? null : id;
    render(); return;
  }
  if (act === 'collapse') { state.expanded = null; render(); return; }

  if (act === 'toggle') {
    e.stopPropagation();
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    const nextStatus = (t.status === 'done') ? 'open' : 'done';
    const i = state.tasks.findIndex(x => x.id === id);
    const completedAt = nextStatus === 'done' ? new Date().toISOString() : null;
    state.tasks[i] = { ...state.tasks[i], status: nextStatus, updated_at: new Date().toISOString(), completed_at: completedAt };
    if (nextStatus === 'done') {
      const before = state.tasks.length;
      state.tasks = spawnNextOccurrence(t, state.tasks);
      if (state.tasks.length > before) toast('Done — next occurrence added to Open');
    }
    render();
    scheduleSave();
    return;
  }

  if (act === 'setstatus') {
    e.stopPropagation(); e.preventDefault();
    const newStatus = el.dataset.status;
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    if (t.status === newStatus) return;
    const i = state.tasks.findIndex(x => x.id === id);
    const completedAt2 = newStatus === 'done' ? new Date().toISOString() : null;
    state.tasks[i] = { ...state.tasks[i], status: newStatus, updated_at: new Date().toISOString(), completed_at: completedAt2 };
    if (newStatus === 'done') {
      const before = state.tasks.length;
      state.tasks = spawnNextOccurrence(t, state.tasks);
      if (state.tasks.length > before) toast('Done — next occurrence added to Open');
    }
    render();
    scheduleSave();
    return;
  }

  if (act === 'flag') {
    e.stopPropagation();
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    await run(() => patchTask(id, { flagged: !t.flagged })); return;
  }

  if (act === 'save') {
    const title    = document.getElementById(`et-${id}`)?.value.trim();
    if (!title) { toast('Title required'); return; }
    const notes    = document.getElementById(`en-${id}`)?.value.trim() || '';
    const start_date = document.getElementById(`es-${id}`)?.value || null;
    const due_date   = document.getElementById(`ed-${id}`)?.value || null;
    const due_time   = document.getElementById(`etm-${id}`)?.value || null;
    const folder     = document.getElementById(`ef-${id}`)?.value.trim() || null;
    const priority    = parseInt(document.getElementById(`ep-${id}`)?.value || '0');
    const flagged     = document.getElementById(`efl-${id}`)?.checked || false;
    const sharedRaw   = document.getElementById(`esw-${id}`)?.value || '';
    const shared_with = sharedRaw.split(',').map(s => s.trim()).filter(Boolean);
    const tagsRaw     = document.getElementById(`etags-${id}`)?.value || '';
    const tags        = tagsRaw.split(',').map(s => s.trim()).filter(Boolean);
    const context     = document.getElementById(`ectx-${id}`)?.value.trim() || null;
    const estimate    = document.getElementById(`eest-${id}`)?.value || null;
    const recurType   = document.getElementById(`ert-${id}`)?.value || '';
    let recurrence = null;
    if (recurType) {
      recurrence = { type: recurType, time: document.getElementById(`ertime-${id}`)?.value || null };
      if (recurType === 'weekly')  recurrence.day = parseInt(document.getElementById(`erd-${id}`)?.value ?? '0');
      if (recurType === 'monthly') recurrence.day = parseInt(document.getElementById(`erm-${id}`)?.value || '1');
    }
    await run(async () => {
      await patchTask(id, { title, notes, start_date, due_date, due_time, folder, priority, flagged, shared_with, recurrence, tags, context, estimate });
      state.expanded = null; toast('Saved');
    }); return;
  }

  if (act === 'showsub') {
    const row = document.getElementById(`subrow-${id}`);
    if (row) { row.style.display = row.style.display === 'none' ? 'flex' : 'none'; }
    document.getElementById(`subinput-${id}`)?.focus();
    return;
  }

  if (act === 'addsub') {
    const input = document.getElementById(`subinput-${id}`);
    const title = input?.value.trim();
    if (!title) return;
    input.value = '';
    await run(async () => { await addTask(title, id); toast('Subtask added'); }); return;
  }

  if (act === 'delete') {
    e.stopPropagation();
    const removed = state.tasks.filter(t => t.id === id || t.parent_id === id);
    if (!removed.length) return;
    state.tasks = state.tasks.filter(t => t.id !== id && t.parent_id !== id);
    if (state.expanded === id) state.expanded = null;
    render();
    scheduleUndoDelete(removed, id);
    return;
  }

  // ── Calendar actions ───────────────────────────────────────────────────────
  if (act === 'cal-day') {
    const date = el.dataset.date;
    if (!date) return;
    if (!ready()) { toast('Set up GitHub in Settings'); openSettings(); return; }
    openQadd('', date);
    return;
  }

  if (act === 'cal-task') {
    // Jump to the task in Open view
    state.view = 'open';
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.view === 'open'));
    state.expanded = id;
    render();
    setTimeout(() => {
      const el = document.querySelector(`[data-id="${id}"] .task-expand`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
    return;
  }
});

// Also handle Enter on subtask input
document.getElementById('taskList').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const input = e.target.closest('.add-sub-input');
  if (!input) return;
  const id = input.id.replace('subinput-', '');
  const title = input.value.trim();
  if (!title) return;
  input.value = '';
  await run(async () => { await addTask(title, id); toast('Subtask added'); });
});

// ── Search ───────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  state.query = e.target.value.trim();
  document.getElementById('searchClear').classList.toggle('show', !!state.query);
  render();
});
document.getElementById('searchClear').addEventListener('click', () => {
  state.query = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  render();
  document.getElementById('searchInput').focus();
});

// ── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const typing = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT';
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && !typing) refresh();
  if (e.key === '/' && !typing) { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !typing) { e.preventDefault(); document.getElementById('captureInput').focus(); }
  if (e.key === 'Escape' && state.bulkMode) exitBulkMode();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') capture();
});

// ── Auto-refresh ─────────────────────────────────────────────────────────────
setInterval(() => { if (ready() && !state.loading) refresh(); }, 30_000);
setInterval(renderSync, 5_000);

// ── Init ─────────────────────────────────────────────────────────────────────
loadCfg();
setupDragDrop();
if (ready()) refresh();
else openSettings();
</script>
